<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 通信先を GitHub API に限る。万一おかしなスクリプトが紛れ込んでも、トークンを外へ送れないようにする -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://api.github.com; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIRTIDA制作室</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PIRTIDA制作室">
<meta name="theme-color" content="#f4f1ea">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --ink:#1d2a3a; --ink-2:#4a5a6c; --ink-3:#8593a3;
  --bg:#f4f1ea; --card:#ffffff; --line:#e3ddd1; --tile:#ebe6db;
  --aqua:#1f8a8c; --aqua-2:#d6eeee; --aqua-ink:#0f5c5e;
  --warn:#b7791f; --warn-bg:#fdf3dc; --bad:#b4442d; --bad-bg:#fbe5df; --ok:#2f7d4f; --ok-bg:#e1f2e6;
  --radius:14px; --shadow:0 1px 2px rgba(29,42,58,.06),0 4px 14px rgba(29,42,58,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--aqua-ink)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:rgba(244,241,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--aqua);display:grid;place-items:center;flex:none}
.brand h1{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-size:17px;margin:0;line-height:1.2}
.brand small{display:block;color:var(--ink-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand select.chan{display:block;margin-top:2px;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg-2,#fff);color:var(--ink-2);max-width:220px}
.line-steps.only-vid .chev{display:none}
/* 画面切り替え：制作の流れ（1→3）をそのままナビにする。稼働・請求は裏方として右端に分ける */
.line{border-top:1px solid var(--line)}
.line-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:stretch;gap:6px;overflow-x:auto;scrollbar-width:none}
.line-in::-webkit-scrollbar{display:none}
.line button{border:0;background:transparent;cursor:pointer;font-weight:500;color:var(--ink-2);padding:11px 10px 9px;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px}
.line button:hover{color:var(--ink)}
.line button.on{color:var(--ink);border-bottom-color:var(--aqua);font-weight:700}
.line-steps{display:flex;align-items:center;gap:2px}
.chev{width:22px;height:2px;background:var(--line);position:relative;flex:none}
.chev:after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--line);border-right:0}
.line-home{margin-right:6px}
.line-aside{margin-left:auto;border-left:1px solid var(--line)!important;padding-left:16px!important}
.badge{font-size:11px;font-weight:700;background:var(--tile);color:var(--ink-2);border-radius:99px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
.badge:empty{display:none}
.badge.hot{background:var(--bad);color:#fff}
/* ホーム */
.home-line{margin-bottom:16px}
.home-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.home-h h2{margin:0;font-size:18px;font-family:"Zen Maru Gothic",sans-serif}
.ln-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ln-stage{position:relative;text-align:left;background:transparent;border:0;border-right:1px solid var(--line);padding:14px 16px 16px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.ln-stage:last-child{border-right:0}
.ln-stage:not(:last-child):after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.ln-stage:hover{background:var(--aqua-2)}
.ln-stage:hover:after{background:var(--aqua-2)}
.ln-head{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--ink-2)}
.ln-no{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:inline-grid;place-items:center;font-size:11px;flex:none}
.ln-big{display:flex;align-items:baseline;gap:4px}
.ln-big b{font-size:30px;line-height:1.1;font-family:"Zen Maru Gothic",sans-serif}
.ln-big small{font-size:12px;color:var(--ink-3)}
.ln-lines{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);min-height:36px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.td-list,.up-list{display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--tile)}
.td:first-child{border-top:0}
.td-lvl{font-size:11px;font-weight:700;border-radius:99px;text-align:center;padding:2px 0}
.td-now .td-lvl{background:var(--bad-bg);color:var(--bad)}
.td-soon .td-lvl{background:var(--warn-bg);color:var(--warn)}
.td-later .td-lvl{background:var(--tile);color:var(--ink-2)}
.td-text{display:flex;flex-direction:column;line-height:1.5}
.td-text small{font-size:12px;color:var(--ink-3)}
.up{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:transparent;border:0;border-top:1px solid var(--tile);padding:10px 0;cursor:pointer}
.up:first-child{border-top:0}
.up:hover .up-title{color:var(--aqua-ink)}
.up-date{font-size:16px;font-weight:700;color:var(--ink-2)}
.up-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.up-title{font-weight:500;line-height:1.45}
.home-map{width:100%;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;text-align:left;background:var(--card);border:1px dashed var(--ink-3);border-radius:14px;padding:14px 16px;cursor:pointer}
.home-map:hover{border-color:var(--aqua);border-style:solid}
/* 作業中（タイマーが動いている人） */
.live-list{display:grid;gap:8px}
.live-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;align-self:center;animation:livepulse 1.6s ease-in-out infinite}
.live-time{font-weight:700;font-size:16px}
.live-card{margin-bottom:14px}
@keyframes livepulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
/* 稼働・請求：月の流れ */
.mflow{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3)}
.mflow span{padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.mflow span.done{color:var(--ok);border-color:var(--ok-bg);background:var(--ok-bg)}
.mflow span.cur{color:#fff;background:var(--aqua);border-color:var(--aqua);font-weight:700}
.mflow i{width:10px;height:1px;background:var(--line)}
/* 書類画面：読み終えた位置に採否 */
.rv-judge{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;box-shadow:0 8px 24px rgba(29,42,58,.14)}
.rv-judge .sp{flex:1}
.rv-crumb{font-weight:700;font-size:15px}
.who{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--tile);color:var(--ink-2);white-space:nowrap}
.chip.aqua{background:var(--aqua-2);color:var(--aqua-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.banner{background:var(--warn-bg);color:#6b4a12;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{margin-left:auto}
.grid{display:grid;gap:16px}
.g-att{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:900px){.g-att{grid-template-columns:minmax(0,1fr)}.home-grid{grid-template-columns:1fr}.ln-big b{font-size:24px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;color:var(--ink-3);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:#fffdf9;border-radius:9px;padding:7px 10px;min-width:0;width:100%}
.f textarea{min-height:70px;resize:vertical}
.f input[type=checkbox],.f input[type=radio]{width:auto;padding:0}
.f input:not([type=checkbox]):not([type=radio]),.f select{min-height:40px}
/* iPad/iPhone の Safari は日付・時刻欄に独自の最小幅を持たせ、隣の欄に重なる。標準の見た目を外して幅に収める */
.f input[type=date],.f input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:38px;text-align:left}
.f input[type=date]::-webkit-date-and-time-value,.f input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--aqua-2);border-color:var(--aqua)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--aqua);border-color:var(--aqua);color:#fff}
.btn.pri:hover{background:var(--aqua-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.monthbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.monthbar .m{font-family:"Zen Maru Gothic",sans-serif;font-size:20px;min-width:130px;text-align:center}
.monthbar .sp{flex:1}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timer .clock{font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;letter-spacing:.02em;min-width:150px}
.timer .clock.run{color:var(--aqua)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--ink-3);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--tile);vertical-align:top}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.ex td{color:var(--ink-3)}
.tablewrap{overflow-x:auto;margin:0 -4px}
.empty{color:var(--ink-3);text-align:center;padding:26px 8px;font-size:13px}
.sum dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.sum dt{color:var(--ink-2)}
.sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700;font-size:16px}
.note{font-size:12px;color:var(--ink-3)}
.bar{height:6px;border-radius:99px;background:var(--tile);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--aqua)}
.bar.over>i{background:var(--bad)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* kanban */
.kb-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.kb-tools .sp{flex:1}
.kanban{display:grid;grid-template-columns:repeat(var(--cols,6),minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.col{background:var(--tile);border-radius:var(--radius);padding:10px;min-height:120px}
.col h3{font-size:12px;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--ink-2)}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.vcard:hover{border-color:var(--aqua)}
.vcard .no{font-size:11px;color:var(--ink-3)}
.vcard .ttl{font-weight:700;margin:2px 0 4px;line-height:1.4}
.vcard .meta{display:flex;flex-wrap:wrap;gap:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(29,42,58,.38);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow-y:auto}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:18px;width:100%;max-width:720px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sheet h2{margin:0 0 4px;font-size:18px;font-family:"Zen Maru Gothic",sans-serif}
.sheet .head{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.sheet .head .sp{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;word-break:break-all}
.timeline{border-left:2px solid var(--tile);margin:8px 0 12px 6px;padding-left:14px}
.tl{margin-bottom:12px;position:relative}
.tl:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--aqua-2);border:2px solid var(--aqua)}
.tl .by{font-size:11px;color:var(--ink-3)}
.tl .body{white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:14px}
.sec-title{font-size:12px;font-weight:700;color:var(--ink-2);margin:16px 0 8px;letter-spacing:.04em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:80;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:var(--bad)}
.loading{opacity:.55;pointer-events:none}
.hide{display:none!important}
.radio{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.radio label{display:flex;gap:6px;align-items:center;cursor:pointer}
/* PDF */
.pdfroot{width:794px;padding:56px 60px;background:#fff;color:#111;font-family:"Noto Sans JP",sans-serif;font-size:12px;line-height:1.6}
.pdfroot h1{font-size:24px;letter-spacing:.4em;text-align:center;margin:0 0 24px;font-weight:700}
.pdfroot .two{display:flex;justify-content:space-between;gap:24px;margin-bottom:22px}
.pdfroot .to{font-size:16px;border-bottom:1px solid #111;padding-bottom:4px;min-width:280px}
.pdfroot table{width:100%;border-collapse:collapse;margin-bottom:14px}
.pdfroot th,.pdfroot td{border:1px solid #999;padding:6px 8px;font-size:11.5px}
.pdfroot th{background:#eef3f3;font-weight:500}
.pdfroot td.n{text-align:right;white-space:nowrap}
.pdfroot .big{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid #111;padding:6px 0;margin:6px 0 20px;width:60%}
.pdfroot .big b{font-size:22px}
.pdfroot .small{font-size:10.5px;color:#444}
.pdfroot .box{border:1px solid #999;padding:8px 10px;margin-bottom:12px;white-space:pre-wrap}
.pb{page-break-before:always;break-before:page}
/* ===== レビュー ===== */
.rv-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.rv-nav .sp{flex:1}
.seg{display:inline-flex;background:var(--tile);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg .num{margin-left:6px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rv-filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rv-search{flex:1 1 200px;max-width:320px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.rv-list-wrap{display:flex;flex-direction:column;gap:8px}
.rv-row{display:grid;grid-template-columns:48px minmax(0,1fr) 64px;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.rv-row:hover{border-color:var(--aqua)}
.rv-id{font-size:18px;font-weight:700;color:var(--ink-2)}
.rv-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-title{font-weight:700;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.rv-count{text-align:center;font-size:11px;color:var(--ink-3);line-height:1.3}
.rv-count.has{color:var(--bad)} .rv-count b{font-size:18px}
.rv-doc-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.rv-doc-title{flex:1 1 260px;min-width:0}
.rv-doc-title h2{margin:2px 0 0;font-size:19px;line-height:1.4;font-family:"Zen Maru Gothic",sans-serif}
.rv-doc-title code{word-break:break-all}
.rv-doc-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.rv-related{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.rv-related .chip{cursor:pointer;border:1px solid var(--line)}
.rv-undo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 12px;background:var(--warn-bg);color:#6b4a12;border-radius:12px;margin-bottom:10px;font-size:13px}
.rv-notes{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.rv-notes summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.rv-notes .timeline{margin-top:10px}
.tl.done{opacity:.6}
.tl.claude:before{background:var(--ok-bg);border-color:var(--ok)}
.rv-q{font-size:12px;color:var(--ink-3);border-left:3px solid var(--line);padding-left:8px;margin:2px 0}
.rv-hint{margin:6px 2px 10px}
.rv-body{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);line-height:1.8;min-width:0;overflow-wrap:anywhere}
.rv-body.rv-html{padding:0;background:#fff}
.rv-body h2,.rv-body h3,.rv-body h4,.rv-body h5{margin:18px 0 6px;line-height:1.45}
.rv-body h2{font-size:20px}.rv-body h3{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:4px}.rv-body h4{font-size:15px}
.rv-body p{margin:6px 0}
.rv-body blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--ink-2)}
.rv-body pre{background:var(--tile);padding:10px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
.rv-body code{background:var(--tile);padding:0 4px;border-radius:4px;font-size:.92em}
.rv-list{margin:6px 0;padding-left:1.4em}
.rv-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.rv-table th,.rv-table td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.rv-table thead th{background:var(--tile);font-weight:700}
.rv-fm{margin-bottom:10px}.rv-fm summary{cursor:pointer;font-size:13px;color:var(--ink-3)}
.rv-fm .rv-table th{width:140px;font-family:ui-monospace,monospace;font-weight:500;color:var(--ink-2);background:var(--bg)}
.rv-blk{cursor:pointer;border-radius:6px;transition:background .15s;position:relative}
.rv-blk:hover{background:rgba(31,138,140,.07)}
.rv-blk:focus-visible{outline:2px solid var(--aqua)}
.rv-blk.has-note{background:var(--warn-bg)}
.rv-blk.has-done{background:var(--ok-bg)}
p.rv-blk.has-note::after,li.rv-blk.has-note::after,h3.rv-blk.has-note::after,h2.rv-blk.has-note::after,h4.rv-blk.has-note::after,blockquote.rv-blk.has-note::after{content:attr(data-count);position:absolute;right:4px;top:4px;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}
tr.rv-blk.has-note td:first-child,tr.rv-blk.has-note th:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.rv-blk.flash{outline:3px solid var(--aqua)}
.rv-sheet-quote{font-size:13px;border-left:3px solid var(--aqua);padding:4px 10px;color:var(--ink-2);background:var(--bg);border-radius:0 8px 8px 0;max-height:140px;overflow:auto}
.rv-existing{background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.rv-existing.done{opacity:.6}
.rv-kinds{gap:10px}
.rv-kinds label{border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--card)}
.rv-kinds label:has(input:checked){border-color:var(--aqua);background:var(--aqua-2)}
.rv-flow{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.rv-step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.rv-step:not(:last-child):before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--tile)}
.rv-dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:var(--card);z-index:1}
.rv-step.ok .rv-dot{border-color:var(--aqua);background:var(--aqua-2)}
.rv-step-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-step-title{font-weight:700}
.rv-annken{display:flex;flex-direction:column;gap:4px}
.rv-pipeline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-pipe{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.rv-arrow{color:var(--ink-3)}
.rv-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:8px}
.rv-idea{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.rv-idea-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 280px}
.rv-idea-memo{font-size:13px;color:var(--ink-2);white-space:pre-wrap;border-left:3px solid var(--line);padding-left:8px}
.rv-idea-acts{display:flex;gap:6px;flex-wrap:wrap}
.rv-folder{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.rv-folder:hover{border-color:var(--aqua)}
.rv-fname{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:500;word-break:break-all}
@media (max-width:600px){
  .rv-row{grid-template-columns:40px minmax(0,1fr) 48px;padding:10px}
  .rv-body{padding:14px 12px}
  .rv-fm .rv-table th{width:96px}
  .rv-map{grid-template-columns:1fr}
}

/* iPhone / iPad：入力欄の文字が16px未満だと、タップ時にSafariが勝手に拡大する */
@media (max-width:1100px){.f input,.f select,.f textarea{font-size:16px}}

@media (max-width:600px){

  .ln-track{grid-template-columns:1fr}

  .ln-stage:last-child{border-bottom:0}
  .ln-stage:not(:last-child):after{right:auto;left:22px;top:auto;bottom:-7px;transform:rotate(135deg)}
  .ln-head{min-width:110px}
  .ln-big b{font-size:22px}
  .ln-lines{min-height:0;flex-direction:row;flex-wrap:wrap;gap:0 10px;flex:1 1 100%;padding-left:27px}
  .home-grid{grid-template-columns:1fr}
  .td{grid-template-columns:56px minmax(0,1fr);}
  .td .btn{grid-column:2;justify-self:start}
  main{padding:14px 12px 80px}
  .card{padding:14px}
  .row .f{flex:1 1 140px;width:auto!important;min-width:0}
  .row>.btn{flex:1 1 100%;padding:11px 14px}
  .timer{flex-direction:column;align-items:stretch;gap:8px}
  .timer .clock{font-size:30px;min-width:0;text-align:center}
  .tablewrap table.t{min-width:600px}

  #workerWrap{flex:1 1 100%;width:auto!important}
  .kanban{grid-template-columns:repeat(var(--cols,6),minmax(78vw,1fr));scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .modal{padding:12px 8px}
  .sheet{padding:16px;border-radius:14px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .actions .btn{flex:1 1 100%}
  .btn.sm{padding:6px 10px}
}
</style>

<main>
  <div class="banner hide" id="demoBanner">
    <b>デモモード</b>　データはこのブラウザ内だけに保存されています。GitHubと連携すると3人で共有できます。

<script>
/* =========================================================
   基本ユーティリティ
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => Math.floor(n).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const fmtHM = m => `${Math.floor(m/60)}時間${pad(m%60)}分`;
const fmtShort = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\s/g, ''))));
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtJP = s => { if (!s) return '—'; const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtJPFull = d => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
const daysBetween = (a, b) => Math.ceil((b - a) / 86400000);
function linkify(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', err ? 5000 : 2400);
}
// 前営業日（土日のみ考慮）
function prevBizDay(d) { const x = new Date(d); while (x.getDay() === 0 || x.getDay() === 6) x.setDate(x.getDate() - 1); return x; }
function monthEnd(month) { const [y,m] = month.split('-').map(Number); return new Date(y, m, 0); }
function nextMonthDay(month, day) { const [y,m] = month.split('-').map(Number); return new Date(y, m, day); }

/* =========================================================
   共有設定（リポジトリ seisaku/settings.json）
   ========================================================= */
const DEFAULT_SETTINGS = {
  project: '動画編集の発注・納品と稼働管理',
  rate: 1182,              // 第6条1項 時間単価（税別）
  taxRate: 0.10,
  freeRevisions: 2,        // 第5条3項 無償修正回数
  inspectionDays: 7,       // 第5条2項 検収期間
  reportDay: 5,            // 第7条1項 翌月5日
  payDay: 25,              // 第7条3項 翌月25日
  client: 'PIRTIDA　髙田 こうた',
  categories: ['動画編集', 'DX業務補助'],
  members: [
    { id: 'kota',       name: 'こうた', role: 'owner',   gh: '' },
    { id: 'tomidokoro', name: '富所',   role: 'editor',  gh: '' },
    { id: 'fuya',       name: 'ふうや', role: 'partner', gh: '' }
  ]
};
const ROLE_LABEL = { owner: '発注者', editor: '編集担当', partner: 'パートナー' };

const STATUSES = [
  { key: 'ordered',   label: '発注済' },
  { key: 'editing',   label: '編集中' },
  { key: 'review',    label: '検収待ち' },
  { key: 'revising',  label: '修正中' },
  { key: 'accepted',  label: '検収合格' },
  { key: 'published', label: '公開済' }
];
const ST = Object.fromEntries(STATUSES.map(s => [s.key, s]));
const statusLabel = k => '編集:' + ST[k].label;
const BASE_LABEL = '編集発注';
const DATA = 'seisaku/'; // 稼働記録・請求書・共有設定の保存先（企画の videos/ とは分ける）

/* =========================================================
   バックエンド：GitHub / デモ（localStorage）
   ========================================================= */
class GitHubBackend {
  constructor(c) { this.c = c; this.rp = `/repos/${c.owner}/${c.repo}`; this.demo = false; }
  async req(method, path, body) {
    const r = await fetch('https://api.github.com' + path, {
      method, cache: 'no-store',
      headers: {
        Authorization: 'Bearer ' + this.c.token,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(body ? { 'Content-Type': 'application/json' } : {})
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).message; } catch {}

/* =========================================================
   チャンネル（GitHub Organization）とリポジトリの割り当て
   1チャンネル＝1 Organization
     kikaku           ネタ・企画・台本・案件     （オーナー・パートナー）

const HENSYU = 'hensyu-', SEIKYU = 'seikyu-';
const CHANNEL_FILE = DATA + 'channel.json';   // 企画リポジトリ：チャンネル名・オーナーとパートナーの名前

class OrdersHub {
  constructor(entries) { this.e = entries; }   // [{ repo, be, editor }]

  async listIssues() { return (await Promise.all(this.e.map(async x => (await x.be.listIssues()).map(g => this.tag(g, x.repo))))).flat(); }

// 見えるリポジトリから、役割・メンバー・契約条件を組み立てる
async function discover(root) {
  const c = state.cfg;
  ws.login = (await root.whoami()).login || '';
  ws.repos = await root.listRepos().catch(() => []);
  const names = ws.repos.map(r => r.name);
  if (!names.some(n => n.startsWith(HENSYU) || n.startsWith(SEIKYU))) return false;   // 旧方式
  ws.mode = 'org';
  const be = repo => new GitHubBackend({ ...c, repo });
  const k = ws.repos.find(r => r.name === c.repo);
  ws.kikaku = k ? { be: root, admin: !!k.permissions.admin } : null;
  for (const n of names) {
    if (n.startsWith(HENSYU)) ws.hensyu[n.slice(HENSYU.length)] = be(n);
    if (n.startsWith(SEIKYU)) ws.seikyu[n.slice(SEIKYU.length)] = be(n);
  }
  ws.role = ws.kikaku ? (ws.kikaku.admin ? 'owner' : 'partner') : 'editor';
  const ids = [...new Set([...Object.keys(ws.hensyu), ...Object.keys(ws.seikyu)])];
  const [chan] = await Promise.all([
    ws.kikaku ? root.readJSON(CHANNEL_FILE).then(r => r.data).catch(() => null) : null,
    ...ids.map(async id => {
      const [ed, t] = await Promise.all([
        ws.hensyu[id] ? ws.hensyu[id].readJSON(EDITOR_FILE).then(r => r.data).catch(() => null) : null,
        ws.seikyu[id] ? ws.seikyu[id].readJSON(TERMS_FILE).then(r => ({ data: r.data, sha: r.sha })).catch(() => null) : null
      ]);
      ws.editorInfo[id] = ed || {};
      const pick = (o, keys) => Object.fromEntries(keys.filter(x => o && o[x] != null).map(x => [x, o[x]]));
      ws.terms[id] = { ...pick(ed, ['freeRevisions', 'inspectionDays']), ...(t?.data || {}) };
    })
  ]);
  ws.channel = chan || {};
  const members = (ws.channel.members || []).filter(m => m.role !== 'editor').map(m => ({ ...m }));
  ids.forEach(id => members.push({ id, name: ws.editorInfo[id].name || id, role: 'editor', gh: ws.editorInfo[id].login || '' }));
  const same = m => m.gh && m.gh.toLowerCase() === ws.login.toLowerCase();
  let mine = members.find(m => same(m) && (m.role === ws.role || ws.role !== 'editor'));
  if (!mine && ws.role === 'editor') mine = members.find(m => m.role === 'editor' && ws.hensyu[m.id]);
  if (!mine) { const cand = members.filter(m => m.role === ws.role); mine = cand.length === 1 ? cand[0] : cand.find(m => m.id === c.me); }
  if (!mine) { mine = { id: ws.login, name: ws.login, role: ws.role, gh: ws.login }; members.push(mine); }
  mine.role = ws.role;   // 役割は GitHub の権限で決まる（名簿の記載より優先）
  state.cfg = { ...c, me: mine.id };
  state.settings = { ...DEFAULT_SETTINGS, ...pickKeys(ws.channel, ['project', 'client', 'categories', 'taxRate', 'reportDay', 'payDay', 'rate']), members };
  return true;
}
const pickKeys = (o, keys) => Object.fromEntries(keys.filter(k => o && o[k] != null).map(k => [k, o[k]]));

  if (ws.mode !== 'org') return TABS;

/* =========================================================
   GitHub のリンクを Chrome で開く（iPhone・iPad）
   Safari は GitHub にログインしていないと非公開リポジトリが404になるため
   ========================================================= */
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const linkMode = () => LS.get('fy_link', IS_IOS ? 'chrome' : 'default'); // 'chrome' | 'default'
function chromeUrl(url) { return url.replace(/^https:\/\//, 'googlechromes://').replace(/^http:\/\//, 'googlechrome://'); }
function isGitHubUrl(url) { return /^https?:\/\/(www\.)?github\.com\//.test(url || ''); }
document.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a) return;
  if (!IS_IOS || linkMode() !== 'chrome' || !isGitHubUrl(a.href)) return;
  e.preventDefault();
  location.href = chromeUrl(a.href);
}, true);

async function loadPlans(force) {
  if (state.plans && !force) return state.plans;
  const md = await api.readText('docs/index.md');
  if (!md) throw new Error('企画一覧（docs/index.md）が見つかりません');
  const plans = [];
  for (const line of md.split('\n')) {
    if (!/^\|\s*\d{3}\s*\|/.test(line)) continue;
    const c = line.split('|').slice(1, -1).map(x => x.trim());
    if (c.length < 10) continue;
    plans.push({ id: c[0], title: c[1], series: c[5], publish: c[6] === '—' ? '' : c[6], length: c[7], status: c[8], file: c[9].replace(/`/g, '') });
  }
  let pdfs = [];
  try { pdfs = (await api.listDir('daihon/pdf')).map(f => f.name); } catch {}
  plans.forEach(pl => { const base = pl.file.replace(/\.md$/, ''); pl.script = pdfs.includes(base + '.pdf') ? `daihon/pdf/${base}.pdf` : ''; });
  state.plans = plans;

}
function parseFrontmatter(text) {
  const m = /^---\s*\n([\s\S]*?)\n---/.exec(text || ''); const fm = {};
  if (!m) return fm;
  for (const raw of m[1].split('\n')) {
    if (/^\s/.test(raw) || !/^[A-Za-z_]+:/.test(raw)) continue; // 入れ子（kpi など）は使わない
    const k = raw.slice(0, raw.indexOf(':')); let v = raw.slice(raw.indexOf(':') + 1).trim();
    if (/^"/.test(v)) v = v.replace(/^"([^"]*)".*$/, '$1');
    else v = v.replace(/\s+#.*$/, '').trim();
    if (/^\[.*\]$/.test(v)) v = v.slice(1, -1).split(',').map(x => x.trim()).filter(Boolean);
    fm[k] = v;
  }
  return fm;
}
function planSection(text, name) {
  const re = new RegExp(`^## ${name}\\s*$([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, 'm');
  const m = re.exec(text || ''); return m ? m[1].trim() : '';
}
function specFromPlan(fm, text) {
  const lines = ['【編集の目安（企画ファイルより）】'];
  if (fm.length_min) lines.push(`- 尺：${fm.length_min}分`);
  if (fm.layout_main) lines.push(`- レイアウト：主 ${fm.layout_main}${fm.layout_sub ? ` ／ 副 ${fm.layout_sub}` : ''}`);
  if (Array.isArray(fm.cameras) && fm.cameras.length) lines.push(`- カメラ：${fm.cameras.join('・')}`);
  if (fm.screen_rec) lines.push(`- 画面録画：${fm.screen_rec === 'true' ? 'あり' : 'なし'}`);
  if (fm.telop_count) lines.push(`- 強調テロップ：${fm.telop_count}個`);
  if (fm.bgm) lines.push(`- BGM：Epidemic Sound プレイリスト ${fm.bgm}`);
  if (fm.edit_target_min) lines.push(`- 編集時間の目標：${fm.edit_target_min}分`);
  for (const sec of ['構成', '画面設計', '必要素材']) {
    const body = planSection(text, sec);
    if (body) lines.push('', `【${sec}】`, body);
  }
  return lines.join('\n');
}

const wlPath = (w, m) => ws.mode === 'org' ? `worklog/${m}.json` : `${DATA}worklog/${w}/${m}.json`;
const wlDir = w => ws.mode === 'org' ? 'worklog' : `${DATA}worklog/${w}`;

// 稼働・請求データの置き場所：新方式は seikyu-<編集者>、旧方式は企画リポジトリの seisaku/
const billApi = w => { if (ws.mode !== 'org') return api; const b = ws.seikyu[w]; if (!b) throw new Error(`${memberName(w)}さんの請求リポジトリ（${SEIKYU}${w}）を見る権限がありません`); return b; };
const emptyWL = (w, m) => ({ worker: w, month: m, entries: [], expenses: [], status: 'draft', history: [] });
async function loadWorklogs(worker) {
  const files = await billApi(worker).listDir(wlDir(worker));
  const months = files.filter(f => f.type === 'file' && /^\d{4}-\d{2}\.json$/.test(f.name)).map(f => f.name.slice(0, 7));
  if (!months.includes(state.month)) months.push(state.month);
  await Promise.all(months.map(async m => {
    const r = await billApi(worker).readJSON(wlPath(worker, m));
    state.worklogs[`${worker}/${m}`] = { data: r.data || emptyWL(worker, m), sha: r.sha };
  }));
}
function curWL() {
  const k = `${state.worker}/${state.month}`;
  return (state.worklogs[k] ||= { data: emptyWL(state.worker, state.month), sha: null }).data;
}
// 最新を取得→変更を適用→保存（競合時は最大3回リトライ）
async function mutateWL(fn, message) {
  const w = state.worker, m = state.month, path = wlPath(w, m);
  for (let i = 0; i < 3; i++) {
    const r = await billApi(w).readJSON(path);
    const data = r.data || emptyWL(w, m);
    const res = fn(data);
    if (res === false) return;
    try {
      await billApi(w).writeB64(path, b64enc(JSON.stringify(data, null, 2)), r.sha, `${message}（${me().name}）`);
      state.worklogs[`${w}/${m}`] = { data, sha: null };
      const fresh = await billApi(w).readJSON(path); state.worklogs[`${w}/${m}`].sha = fresh.sha;
      return;
    } catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }
  }
  throw new Error('他の人の更新と競合しました。再読み込みしてください。');
}

/* 請求計算：上限・無償修正・固定額を反映 */
function computeBilling() {
  const all = [];
  for (const [k, v] of Object.entries(state.worklogs)) if (k.startsWith(state.worker + '/')) all.push(...v.data.entries);
  all.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const used = {}, res = {};
  const iss = Object.fromEntries(workerIssues().map(i => [i.no, i]));
  for (const e of all) {
    const I = e.issue ? iss[e.issue] : null;
    if (e.free) { res[e.id] = { bill: 0, reason: '無償修正' }; continue; }
    if (I && I.meta.fixedFee) { res[e.id] = { bill: 0, reason: '固定額案件' }; used[e.issue] = (used[e.issue] || 0) + e.minutes; continue; }
    if (I && I.meta.capHours) {
      const cap = I.meta.capHours * 60, u = used[e.issue] || 0;
      used[e.issue] = u + e.minutes;
      if (e.overApproved) { res[e.id] = { bill: e.minutes, reason: u + e.minutes > cap ? '上限超過（承認済）' : '' }; continue; }
      const ok = Math.max(0, Math.min(e.minutes, cap - u));
      res[e.id] = { bill: ok, reason: ok < e.minutes ? `上限超過 ${e.minutes - ok}分（未承認）` : '' };
      continue;
    }
    if (e.issue) used[e.issue] = (used[e.issue] || 0) + e.minutes;
    res[e.id] = { bill: e.minutes, reason: '' };
  }
  return { res, used };
}
function monthSummary() {
  const S = termsOf(state.worker), wl = curWL(), { res, used } = computeBilling();
  const total = wl.entries.reduce((a, e) => a + e.minutes, 0);
  const bill = wl.entries.reduce((a, e) => a + (res[e.id]?.bill ?? e.minutes), 0);
  const byCat = {};
  for (const e of wl.entries) { const b = res[e.id]?.bill ?? e.minutes; byCat[e.category] = (byCat[e.category] || 0) + b; }
  const hourly = Math.floor(bill * S.rate / 60);                         // 第6条2項 月合計→1円未満切捨て
  const fixed = state.issues.filter(i => i.meta.fixedFee && i.meta.assignee === state.worker && i.meta.acceptedAt && ym(new Date(i.meta.acceptedAt)) === state.month)
    .map(i => ({ label: `固定額：${i.title}`, amount: Number(i.meta.fixedFee) }));
  const fixedSum = fixed.reduce((a, f) => a + f.amount, 0);
  const exps = wl.expenses.filter(x => x.approved);
  const expSum = exps.reduce((a, x) => a + Number(x.amount || 0), 0);
  const sub = hourly + fixedSum + expSum;
  const tax = Math.floor(sub * S.taxRate);
  const issuer = getIssuer();
  const wh = issuer.withholding ? Math.floor((hourly + fixedSum) * (hourly + fixedSum > 1000000 ? 0.2042 : 0.1021)) : 0;
  return { total, bill, excluded: total - bill, byCat, hourly, fixed, fixedSum, exps, expSum, sub, tax, wh, grand: sub + tax - wh, res, used };
}

function updateClock() {
  $$('[data-since]').forEach(x => { x.textContent = fmtSince(Number(x.dataset.since)); });
  const t = curTimer(), c = $('#clock'), b = $('#tBtn');
  if (!t) { c.textContent = '0:00:00'; c.classList.remove('run'); b.textContent = '開始'; b.className = 'btn pri'; return; }
  const s = Math.floor((Date.now() - t.start) / 1000);
  c.textContent = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  c.classList.add('run'); b.textContent = '停止して記録'; b.className = 'btn dark';
}
setInterval(updateClock, 1000);

function calcMinutes(start, end, brk) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number), [eh, em] = end.split(':').map(Number);
  let m = (eh * 60 + em) - (sh * 60 + sm); if (m < 0) m += 1440;
  return Math.max(0, m - (Number(brk) || 0));
}
function updateCalc() { const m = calcMinutes($('#eStart').value, $('#eEnd').value, $('#eBreak').value); $('#eCalc').textContent = m ? `稼働 ${fmtHM(m)}` : ''; }

async function guarded(btn, fn) {
  const el = btn instanceof Element ? btn : null; if (el) el.disabled = true;
  document.body.classList.add('busy');
  try { await fn(); } catch (e) { console.error(e); toast(e.message || String(e), true); }
  finally { if (el) el.disabled = false; }
}

async function makePdf(mode) {

  if (!getIssuer().bank) toast('振込先が未設定です。設定画面の「請求書に記載するあなたの情報」から入力できます');
  await document.fonts.ready;
  // 1ページ目（請求書）と2ページ目以降（稼働報告書）を別々に描画して結合
  const [p1, p2] = invoiceHTML().split('<div class="pb"></div>');
  const pages = [`${p1}</div>`, `<div class="pdfroot">${p2}`];
  const opt = { margin: [0, 0, 0, 0], filename: invoiceFileName(), image: { type: 'jpeg', quality: 0.96 }, html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 }, jsPDF: { unit: 'px', format: [794, 1123], hotfixes: ['px_scaling'] }, pagebreak: { mode: ['avoid-all'] } };
  let w = html2pdf().set(opt).from(pages[0], 'string').toPdf();
  for (const p of pages.slice(1)) w = w.get('pdf').then(pdf => pdf.addPage()).from(p, 'string').toContainer().toCanvas().toPdf();
  if (mode === 'save') { await w.save(); return null; }
  return await w.outputPdf('datauristring');

async function loadIssues() { state.issues = hub ? (await hub.listIssues()).map(parseIssue) : []; }

function cardBadges(i) {
  const out = [], now = new Date(), m = i.meta, T = termsOf(m.assignee);
  if (m.due && ['ordered', 'editing', 'revising'].includes(i.status)) {
    const d = daysBetween(new Date(ymd(now)), parseDate(m.due));
    out.push(`<span class="chip ${d < 0 ? 'bad' : d <= 2 ? 'warn' : ''}">納期 ${fmtJP(m.due)}${d < 0 ? `（${-d}日超過）` : d === 0 ? '（今日）' : `（あと${d}日）`}</span>`);
  }
  if (i.status === 'review' && m.deliveries.length) {
    const lim = new Date(m.deliveries.at(-1).at); lim.setDate(lim.getDate() + T.inspectionDays);
    const d = daysBetween(now, lim);
    out.push(`<span class="chip ${d < 0 ? 'bad' : d <= 2 ? 'warn' : 'aqua'}">${d < 0 ? '検収期限切れ（みなし合格）' : `検収期限 ${fmtJP(lim)}（あと${d}日）`}</span>`);
  }
  const free = m.revisions.filter(r => !r.paid).length;
  if (m.revisions.length) out.push(`<span class="chip ${free >= T.freeRevisions ? 'warn' : ''}">無償修正 ${free}/${T.freeRevisions}</span>`);
  if (m.capHours && canSeeBilling(m.assignee)) { const u = computeUsed()[`${m.assignee}/${i.no}`] || 0; out.push(`<span class="chip ${u > m.capHours * 60 ? 'bad' : ''}">稼働 ${fmtShort(u)}/${m.capHours}h</span>`); }
  if (m.fixedFee && canSeeBilling(m.assignee)) out.push(`<span class="chip">固定 ${yen(m.fixedFee)}円</span>`);
  if (m.assignee) out.push(`<span class="chip">${esc(memberName(m.assignee))}</span>`);
  return out.join('');
}
function computeUsed() {
  const used = {};
  for (const [k, v] of Object.entries(state.worklogs)) { const w = k.split('/')[0]; for (const e of v.data.entries) if (e.issue && !e.free) used[`${w}/${e.issue}`] = (used[`${w}/${e.issue}`] || 0) + e.minutes; }
  return used;
}
function renderVid() {
  const hide = $('#hidePub').checked;
  const cols = STATUSES.filter(s => !(hide && s.key === 'published'));
  $('#kanban').style.setProperty('--cols', cols.length);
  $('#kanban').innerHTML = cols.map(s => {
    const list = state.issues.filter(i => i.status === s.key).sort((a, b) => (a.meta.due || '9').localeCompare(b.meta.due || '9'));
    return `<div class="col"><h3><span>${s.label}</span><span>${list.length}</span></h3>${list.map(i => `
      <div class="vcard" data-n="${i.number}">
        <div class="no">#${i.no}${i.meta.planId ? `　企画${esc(i.meta.planId)}` : ''}${i.meta.series ? `　${esc(i.meta.series)}` : ''}</div>
        <div class="ttl">${esc(i.title)}</div>
        <div class="meta">${cardBadges(i)}</div>
      </div>`).join('') || '<div class="note" style="padding:6px">—</div>'}</div>`;
  }).join('');
  const links = hub ? hub.repoLinks() : [];
  $('#repoLink').innerHTML = links.length ? 'GitHub：' + links.map(l => `<a href="${l.url}/issues?q=label%3A${encodeURIComponent(BASE_LABEL)}" target="_blank" rel="noopener">${esc(l.name)}</a>`).join('　') : '';
  $('#btnNewVideo').classList.toggle('hide', !isOwner());
}

$('#btnNewVideo').onclick = () => { openModal(videoForm(null)); bindVideoForm(null); };
function fillPlanSelect() {
  const sel = $('#vPlan'); if (!sel || !state.plans) return;
  const all = $('#vPlanAll').checked;
  const ordered = new Map(state.issues.filter(x => x.meta.planId).map(x => [x.meta.planId, x]));
  const list = state.plans.filter(pl => all || PLAN_READY.includes(pl.status));
  const cur = sel.value;
  sel.innerHTML = `<option value="">（企画を選ぶ）</option>` + list.map(pl => {
    const o = ordered.get(pl.id);
    return `<option value="${esc(pl.id)}" ${o ? 'disabled' : ''} ${pl.id === cur ? 'selected' : ''}>${esc(pl.id)} ${esc(pl.title)}（${esc(pl.status)}${o ? `・発注済 #${o.no}` : ''}）</option>`;
  }).join('') + `<option value="__none">企画を選ばずに入力する</option>`;
  if (!list.length) $('#vPlanInfo').textContent = '承認済・撮影・編集の企画がありません。下のチェックを入れると全部の企画から選べます。';
}
async function applyPlan(id) {
  const info = $('#vPlanInfo');
  state.planPick = null;
  if (!id || id === '__none') { info.textContent = id ? '企画に紐づけずに発注します。タイトルと指示を入力してください。' : '企画を選ぶと、タイトル・尺・編集の目安・台本のリンクを企画ファイルから自動で入れます。'; return; }
  const pl = state.plans.find(x => x.id === id); if (!pl) return;
  info.textContent = '企画ファイルを読み込み中…';
  const text = await api.readText('videos/' + pl.file);
  if (text == null) { info.textContent = `videos/${pl.file} が見つかりませんでした。`; return; }
  const fm = parseFrontmatter(text);
  $('#vTitle').value = `${pl.id} ${fm.title || pl.title}`;
  $('#vSeries').value = (pl.series && pl.series !== '—') ? pl.series : (fm.series ? fm.series + (fm.episode ? ` #${fm.episode}` : '') : '');
  $('#vLen').value = fm.length_min ? `${fm.length_min}分` : pl.length;
  $('#vSpec').value = specFromPlan(fm, text);
  if (fm.edit_target_min && !$('#vCap').value) $('#vCap').value = Math.ceil(Number(fm.edit_target_min) / 30) / 2;
  const planUrl = api.fileUrl('videos/' + pl.file), scriptUrl = pl.script ? api.fileUrl(pl.script) : '';
  state.planPick = { planId: pl.id, planTitle: fm.title || pl.title, planFile: pl.file, planUrl: planUrl || '', scriptUrl: ws.mode === 'org' ? '' : (scriptUrl || ''), scriptPath: pl.script || '' };
  info.innerHTML = `企画ファイルから入力しました（状態：${esc(pl.status)}${pl.publish ? `／公開予定 ${esc(pl.publish)}` : ''}）。` +
    `${planUrl ? ` <a href="${planUrl}" target="_blank" rel="noopener">企画を開く</a>` : ''}${scriptUrl ? ` ／ <a href="${scriptUrl}" target="_blank" rel="noopener">台本PDF</a>` : '（台本PDFはまだありません）'}` +
    `${fm.edit_target_min ? `<br>上限稼働時間は編集時間の目標（${esc(fm.edit_target_min)}分）から入れています。必要なら変えてください。` : ''}`;
}
function bindVideoForm(i) {
  $$('[data-close]', $('#sheet')).forEach(b => b.onclick = closeModal);
  if (!i) {
    loadPlans().then(fillPlanSelect).catch(err => { $('#vPlan').innerHTML = '<option value="__none">企画を選ばずに入力する</option>'; $('#vPlanInfo').textContent = `企画リストを読み込めませんでした：${err.message}`; });
    $('#vPlanAll').onchange = fillPlanSelect;
    $('#vPlan').onchange = e => guarded(null, () => applyPlan(e.target.value));
  }
  $('#vSave').onclick = e => guarded(e.currentTarget, async () => {
    const title = $('#vTitle').value.trim(); if (!title) return toast('企画を選ぶか、タイトルを入力してください', true);
    if (!i && !$('#vPlan').value) return toast('企画を選んでください（企画がない場合は「企画を選ばずに入力する」）', true);
    const patch = { series: $('#vSeries').value.trim(), spec: $('#vSpec').value, length: $('#vLen').value, due: $('#vDue').value, rawUrl: $('#vRaw').value.trim(), capHours: Number($('#vCap').value) || 0, fixedFee: Number($('#vFee').value) || 0, assignee: $('#vAsg').value };
    if (!i) {
      if (state.planPick && state.issues.some(x => x.meta.planId === state.planPick.planId)) return toast('この企画はすでに発注済みです', true);
      const meta = { ...patch, ...(state.planPick || {}), deliveries: [], revisions: [], publishedUrl: '', orderedAt: new Date().toISOString(), orderedBy: me().id };
      const gh = await hub.createIssue({ title, body: buildBody(meta), labels: [BASE_LABEL, statusLabel('ordered')] }, meta.assignee);
      const key = `${gh.__repo}/${gh.number}`;
      if (ws.mode === 'org' && meta.scriptPath) {
        try { const url = await sendScript(key, meta.scriptPath); await mutateIssue(key, m => { m.scriptUrl = url; }); }
        catch (err) { toast(`台本PDFを添付できませんでした：${err.message}`, true); }
      }
      await hub.addComment(key, `📝 **発注**（${me().name}）\n納期：${meta.due || '未定'}　上限稼働：${meta.capHours ? meta.capHours + '時間' : 'なし'}${meta.fixedFee ? `　固定額：${yen(meta.fixedFee)}円` : ''}\n担当の方は内容を確認し「承諾して着手」を押してください（2営業日以内）。`);
      toast('発注しました');
    } else {
      await mutateIssue(i.number, (meta) => Object.assign(meta, patch), { title });
      await hub.addComment(i.number, `✏️ **発注内容を変更**（${me().name}）`);
      toast('保存しました');
    }
    await loadIssues(); renderVid(); closeModal();
  });
}
async function mutateIssue(n, fn, extra = {}) {
  const cur = parseIssue(await hub.getIssue(n));
  const meta = cur.meta; fn(meta, cur);
  const st = extra.status || cur.status;
  const labels = cur.labels.filter(l => !l.startsWith('編集:')).concat(statusLabel(st));
  if (!labels.includes(BASE_LABEL)) labels.push(BASE_LABEL);
  await hub.updateIssue(n, { body: buildBody(meta), labels, ...(extra.title ? { title: extra.title } : {}), ...(extra.state ? { state: extra.state } : {}) });
}

async function openDetail(n) {
  const i = state.issues.find(x => x.number === n); if (!i) return;
  openModal(`<div class="note">読み込み中…</div>`);
  let comments = [];
  try { comments = await hub.listComments(n); } catch (e) { toast(e.message, true); }
  const m = i.meta, role = me().role, mine = m.assignee === me().id || role === 'owner';
  const free = m.revisions.filter(r => !r.paid).length;
  const acts = [];
  if (i.status === 'ordered' && (role === 'editor' && mine)) acts.push(`<button class="btn pri" data-act="accept">承諾して着手</button>`);
  if (['editing', 'revising'].includes(i.status) && role === 'editor' && mine) acts.push(`<button class="btn pri" data-act="deliver">${i.status === 'revising' ? '修正版を納品' : '納品する'}</button>`);
  if (i.status === 'review' && ['owner', 'partner'].includes(role)) acts.push(`<button class="btn" data-act="revise">修正を依頼</button>`);
  if (i.status === 'review' && role === 'owner') acts.push(`<button class="btn pri" data-act="pass">検収合格</button>`);
  if (i.status === 'accepted' && role === 'owner') acts.push(`<button class="btn dark" data-act="publish">公開済にする</button>`);
  if (role === 'owner' && i.status !== 'published') acts.push(`<button class="btn" data-act="edit">発注内容を編集</button>`);
  if (role === 'owner' && ws.mode === 'org' && m.planId && i.status !== 'published') acts.push(`<button class="btn" data-act="script">台本PDFを${m.scriptUrl ? '送り直す' : '添付する'}</button>`);
  const ghu = hub.issueUrl(n);
  const used = computeUsed()[`${m.assignee}/${i.no}`] || 0, T = termsOf(m.assignee);
  openModal(`
    <div class="head"><div><div class="note">#${i.no}${m.planId ? `　企画${esc(m.planId)}` : ''}${m.series ? `　${esc(m.series)}` : ''}　<span class="chip aqua">${ST[i.status].label}</span></div><h2>${esc(i.title)}</h2></div><span class="sp"></span><button class="btn sm" data-close>閉じる</button></div>
    <div class="meta" style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px">${cardBadges(i)}</div>
    ${acts.length ? `<div class="actions">${acts.join('')}</div>` : ''}
    <dl class="kv">
      ${(m.planUrl && canSeePlans()) || m.scriptUrl ? `<dt>企画・台本</dt><dd>${m.planUrl && canSeePlans() ? `<a href="${m.planUrl}" target="_blank" rel="noopener">企画ファイル</a>` : ''}${m.scriptUrl ? `　<a href="${m.scriptUrl}" target="_blank" rel="noopener">台本PDF</a>` : ''}</dd>` : ''}
      <dt>仕様・指示</dt><dd style="white-space:pre-wrap">${linkify(m.spec || '—')}</dd>
      <dt>尺の目安</dt><dd>${esc(m.length || '—')}</dd>
      <dt>納期</dt><dd>${esc(m.due || '—')}</dd>
      <dt>担当</dt><dd>${esc(memberName(m.assignee))}</dd>
      ${canSeeBilling(m.assignee) ? `<dt>報酬</dt><dd>${m.fixedFee ? `固定額 ${yen(m.fixedFee)}円（税別）` : `時間単価${m.capHours ? `（上限 ${m.capHours}時間／現在 ${fmtShort(used)}）` : ''}`}</dd>` : ''}
      <dt>撮影素材</dt><dd>${m.rawUrl ? linkify(m.rawUrl) : '—'}</dd>
      <dt>納品物</dt><dd>${m.deliveries.length ? m.deliveries.map((d, k) => `v${k + 1}（${fmtJP(d.at)}）${linkify(d.url)}`).join('<br>') : '—'}</dd>
      <dt>修正依頼</dt><dd>${m.revisions.length ? `${m.revisions.length}回（無償 ${free}/${T.freeRevisions}${m.revisions.some(r => r.paid) ? '・有償あり' : ''}）` : 'なし'}</dd>
      ${m.publishedUrl ? `<dt>公開URL</dt><dd>${linkify(m.publishedUrl)}</dd>` : ''}
      ${ghu ? `<dt>GitHub</dt><dd><a href="${ghu}" target="_blank" rel="noopener">Issue #${i.no} を開く</a></dd>` : ''}
    </dl>
    <div class="sec-title">やりとり</div>
    <div class="timeline">${comments.length ? comments.map(c => `<div class="tl"><div class="by">${esc(c.user?.login || '')}・${new Date(c.created_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div><div class="body">${linkify(c.body)}</div></div>`).join('') : '<div class="note">まだやりとりはありません</div>'}</div>
    <div class="f"><label>コメント</label><textarea id="cBody" placeholder="${esc(me().name)}としてコメント"></textarea></div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn dark" id="cSend">送信</button></div>
  `);
  $$('[data-close]', $('#sheet')).forEach(b => b.onclick = closeModal);
  $('#cSend').onclick = e => guarded(e.currentTarget, async () => { const t = $('#cBody').value.trim(); if (!t) return; await hub.addComment(n, `💬 **${me().name}**\n${t}`); openDetail(n); });
  $$('[data-act]', $('#sheet')).forEach(b => b.onclick = () => doAction(i, b.dataset.act, b));
}
function subForm(title, inner, onOk, okLabel = '確定') {
  const prev = $('#sheet').innerHTML;
  openModal(`<div class="head"><h2>${title}</h2><span class="sp"></span><button class="btn sm" id="sfBack">戻る</button></div>${inner}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn pri" id="sfOk">${okLabel}</button></div>`);
  $('#sfBack').onclick = () => openDetail(onOk.n);
  $('#sfOk').onclick = e => guarded(e.currentTarget, onOk);
}
async function finish(n, msg) { await loadIssues(); renderVid(); if (state.tab === 'att') renderAtt(); toast(msg); openDetail(n); }
function doAction(i, act, btn) {
  const n = i.number, who = me().name, S = termsOf(i.meta.assignee);
  if (act === 'edit') { openModal(videoForm(i)); bindVideoForm(i); return; }
  if (act === 'script') return guarded(btn, async () => {
    const pl = (await loadPlans(true)).find(p => p.id === i.meta.planId);
    if (!pl?.script) return toast(`企画${i.meta.planId}の台本PDF（daihon/pdf/）がまだありません`, true);
    const url = await sendScript(n, pl.script);
    await mutateIssue(n, m => { m.scriptUrl = url; m.scriptPath = pl.script; });
    await hub.addComment(n, `📎 **台本PDFを添付**（${who}）\n${url}`);
    await finish(n, '台本PDFを添付しました');
  });
  if (act === 'accept') return guarded(btn, async () => {
    await mutateIssue(n, m => { m.acceptedOrderAt = new Date().toISOString(); }, { status: 'editing' });
    await hub.addComment(n, `🤝 **承諾・着手**（${who}）\n個別契約が成立しました。`);
    await finish(n, '着手しました');
  });
  if (act === 'deliver') {
    const f = async () => {
      const url = $('#dUrl').value.trim(); if (!url) return toast('納品物のURLを入力してください', true);
      const note = $('#dNote').value.trim(), ai = $('#dAI').value.trim(), mat = $('#dMat').value.trim();
      let v;
      await mutateIssue(n, m => { m.deliveries.push({ at: new Date().toISOString(), by: me().id, url, note, ai, materials: mat }); v = m.deliveries.length; }, { status: 'review' });
      const lim = new Date(); lim.setDate(lim.getDate() + S.inspectionDays);
      await hub.addComment(n, `📦 **納品 v${v}**（${who}）\n${url}${note ? '\n' + note : ''}${mat ? `\n使用素材（第8条5項）：${mat}` : ''}${ai ? `\n生成AIの利用（第9条2項）：${ai}` : ''}\n検収期限：${fmtJPFull(lim)}`);
      await finish(n, '納品しました');
    }; f.n = n;
    subForm('納品する', `
      <div class="fgrid">
        <div class="f full"><label>完成動画（MP4）・プロジェクトファイルのURL</label><input id="dUrl" placeholder="https://drive.google.com/…"></div>
        <div class="f full"><label>メモ</label><textarea id="dNote" placeholder="修正点や確認してほしい箇所"></textarea></div>
        <div class="f full"><label>使用したBGM・フォント・素材（名称／提供元／ライセンス）</label><input id="dMat"></div>
        <div class="f full"><label>生成AIを使った場合：サービス名と使った範囲（事前承諾が必要）</label><input id="dAI" placeholder="使っていなければ空欄"></div>
      </div>`, f, '納品する');
    return;
  }
  if (act === 'revise') {
    const free = i.meta.revisions.filter(r => !r.paid).length;
    const f = async () => {
      const note = $('#rNote').value.trim(); if (!note) return toast('修正内容を入力してください', true);
      const paid = $$('input[name=rType]').find(r => r.checked).value === 'paid';
      await mutateIssue(n, m => { m.revisions.push({ at: new Date().toISOString(), by: me().id, note, paid }); }, { status: 'revising' });
      await hub.addComment(n, `🔁 **修正依頼**（${who}・${paid ? '有償：稼働時間に算入' : '無償修正'}）\n${note}`);
      await finish(n, '修正を依頼しました');
    }; f.n = n;
    subForm('修正を依頼', `
      <div class="f"><label>修正内容</label><textarea id="rNote" style="min-height:110px" placeholder="例：02:15 のテロップ誤字「アプル」→「アプリ」"></textarea></div>
      <div class="sec-title">修正の種類（第5条）</div>
      <div class="radio">
        <label><input type="radio" name="rType" value="free" ${free < S.freeRevisions ? 'checked' : ''} ${free >= S.freeRevisions ? 'disabled' : ''}> 無償修正（仕様に合っていない箇所）残り${Math.max(0, S.freeRevisions - free)}回</label>
        <label><input type="radio" name="rType" value="paid" ${free >= S.freeRevisions ? 'checked' : ''}> 有償（指示の変更・追加、または回数超過）</label>
      </div>
      <div class="note" style="margin-top:6px">有償の修正にかかった時間は稼働時間に算入され、上限の事前承諾があったものとみなされます。</div>`, f, '依頼する');
    return;
  }
  if (act === 'pass') return guarded(btn, async () => {
    if (!confirm('検収合格にしますか？（固定額案件は今月の請求に計上されます）')) return;
    await mutateIssue(n, m => { m.acceptedAt = new Date().toISOString(); }, { status: 'accepted' });
    await hub.addComment(n, `✅ **検収合格**（${who}）`);
    await finish(n, '検収合格にしました');
  });
  if (act === 'publish') {
    const f = async () => {
      const url = $('#pUrl').value.trim();
      await mutateIssue(n, m => { m.publishedUrl = url; m.publishedAt = new Date().toISOString(); }, { status: 'published', state: 'closed' });
      await hub.addComment(n, `🎉 **公開**（${who}）${url ? '\n' + url : ''}`);
      await finish(n, '公開済にしました');
    }; f.n = n;
    subForm('公開済にする', `<div class="f"><label>YouTubeのURL（任意）</label><input id="pUrl" placeholder="https://youtu.be/…"></div>`, f, '公開済にする');
  }

/* =========================================================
   レビュー（企画書・台本・案件への修正メモ／採否／元に戻す／地図）
   要件：tools/seisakushitsu/レビュー機能_要件.md
   ========================================================= */
const RV_LABEL = 'レビュー';
const NOTE_KINDS = {
  rewrite: { label: '書き直してほしい', icon: '✏️', chip: 'aqua' },
  question: { label: '質問・相談', icon: '💬', chip: '' },
  factcheck: { label: '事実確認', icon: '🔎', chip: 'warn' }
};
const PLAN_STATUSES = ['レビュー待ち', '要修正', '承認済', '撮影', '編集', '公開', 'ネタ', '下書き', 'ボツ'];
const ANNKEN_MEMO_FILES = ['企画提案書.md', '案件概要.md', '価格考察.md', '返信案.md'];
const rv = {
  view: 'list', filter: 'レビュー待ち', onlyOpen: false, q: '',
  byPath: {}, loaded: false, loading: null,
  links: null, tplCss: null,
  doc: null, folder: '', planId: null, sheet: null
};
const canReview = () => ['owner', 'partner'].includes(me().role);
function canMemo(path) {
  if (!canReview()) return false;
  if (/^videos\/[^/]+\.md$/.test(path)) return true;
  if (/^daihon\/html\/[^/]+\.html$/.test(path)) return true;
  const m = /^annken\/([^/]+)\/([^/]+)$/.exec(path);
  return !!(m && !m[1].startsWith('_') && ANNKEN_MEMO_FILES.includes(m[2]));
}
function docKind(path) {
  if (path.startsWith('videos/')) return '企画書';
  if (path.startsWith('daihon/html/')) return '台本';
  if (path.startsWith('daihon/')) return '旧台本';
  if (path.startsWith('annken/')) return '案件';
  if (path.startsWith('manual/')) return 'マニュアル';
  if (path.startsWith('plan/')) return '計画書';
  if (path.startsWith('docs/')) return '自動生成';
  return '書類';
}
const planIdOf = path => {
  const m = /^(?:videos|daihon\/html|daihon\/pdf|daihon)\/(\d{3})-/.exec(path); if (m) return m[1];
  const a = /^annken\/([^/]+)\//.exec(path);
  if (a && rv.links) { const ids = Object.keys(rv.links.annken).filter(id => rv.links.annken[id].includes(a[1])); if (ids.length === 1 || (ids.length && ids.includes(rv.planId))) return ids.includes(rv.planId) ? rv.planId : ids[0]; }
  return null;
};
const todayStr = () => ymd(new Date());

/* ---------- メモ・返信の読み書き（Issue コメント） ---------- */
function parseMeta(body, tag) {
  const m = new RegExp(`<!-- ${tag}\\s*([\\s\\S]*?)\\s*-->`).exec(body || '');
  if (!m) return null; try { return JSON.parse(m[1]); } catch { return null; }
}
const metaBlock = (tag, obj) => `<!-- ${tag}\n${JSON.stringify(obj).replace(/-->/g, '--\\u003e')}\n-->`;
function noteBody(meta, text) {
  const k = NOTE_KINDS[meta.kind] || NOTE_KINDS.rewrite;
  const quote = (meta.anchor?.quote || '').slice(0, 200);
  return `${metaBlock('fy-note', meta)}\n**${k.icon} ${k.label}**（${memberName(meta.by)}）　${meta.anchor?.label ? `『${meta.anchor.label}』` : ''} ${meta.anchor?.line ? `${meta.anchor.line}行目付近` : ''}\n\n> ${quote.replace(/\n/g, ' ')}\n\n${text}`;
}
function noteText(body) { return String(body || '').replace(/<!--[\s\S]*?-->\s*/, '').replace(/^\*\*[^\n]*\n+(> [^\n]*\n+)?/, '').trim(); }
async function loadReviewIssues(force) {
  if (rv.loaded && !force) return;
  if (rv.loading && !force) return rv.loading;
  rv.loading = (async () => {
    const list = await api.listIssuesByLabel(RV_LABEL);
    const byPath = {};
    await Promise.all(list.map(async iss => {
      const meta = parseMeta(iss.body, 'fy-review'); if (!meta?.path) return;
      const comments = await api.listComments(iss.number);
      byPath[meta.path] = buildDocNotes(iss, comments);
    }));
    rv.byPath = byPath; rv.loaded = true;
  })();
  try { await rv.loading; } finally { rv.loading = null; }
}
function buildDocNotes(iss, comments) {
  const notes = [], replies = [], reverts = [];
  for (const c of comments) {
    const n = parseMeta(c.body, 'fy-note');
    if (n) { notes.push({ ...n, id: c.id, body: c.body, text: noteText(c.body), at: c.created_at, url: c.html_url }); continue; }
    const r = parseMeta(c.body, 'fy-reply');
    if (r) { replies.push({ ...r, id: c.id, text: String(c.body).replace(/<!--[\s\S]*?-->\s*/, '').trim(), at: c.created_at, url: c.html_url }); continue; }
    const v = parseMeta(c.body, 'fy-revert');
    if (v) reverts.push({ ...v, id: c.id, at: c.created_at });
  }
  return { issue: iss, notes, replies, reverts };
}
async function refreshDocNotes(path) {
  const d = rv.byPath[path]; if (!d) return;
  rv.byPath[path] = buildDocNotes(d.issue, await api.listComments(d.issue.number));
}
const openCount = path => (rv.byPath[path]?.notes || []).filter(n => n.status !== 'done').length;
async function ensureReviewIssue(path) {
  if (rv.byPath[path]) return rv.byPath[path];
  const url = api.fileUrl(path);
  const iss = await api.createIssue({
    title: `レビュー：${path}`,
    body: `${metaBlock('fy-review', { path })}\n\n**${docKind(path)}** \`${path}\` への修正メモです。${url ? `\n\n${url}` : ''}\n\n---\n<sub>メモは制作室ツールの「レビュー」タブから書き込みます。Claude は未対応のメモを読んで反映し、このIssueに返信します。</sub>`,
    labels: [RV_LABEL]
  });
  rv.byPath[path] = buildDocNotes(iss, []);
  return rv.byPath[path];
}
async function addNote(path, anchor, kind, text) {
  const d = await ensureReviewIssue(path);
  const meta = { v: 1, path, kind, anchor, status: 'open', by: me().id };
  await api.addComment(d.issue.number, noteBody(meta, text));
  await refreshDocNotes(path);
}
async function setNoteStatus(path, note, status) {
  const meta = parseMeta(note.body, 'fy-note'); meta.status = status;
  await api.updateComment(note.id, note.body.replace(/<!-- fy-note[\s\S]*?-->/, metaBlock('fy-note', meta)));
  await refreshDocNotes(path);
}

/* ---------- 関連づけ（台本・案件・発注） ---------- */
async function loadLinks(force) {
  if (rv.links && !force) return rv.links;
  const links = { scripts: {}, pdfs: {}, annken: {}, annkenDirs: [] };
  const [html, pdf, ann] = await Promise.all([api.listDir('daihon/html'), api.listDir('daihon/pdf'), api.listDir('annken')]);
  html.filter(f => f.name.endsWith('.html')).forEach(f => { const id = f.name.slice(0, 3); links.scripts[id] = 'daihon/html/' + f.name; });
  pdf.filter(f => f.name.endsWith('.pdf')).forEach(f => { links.pdfs[f.name.slice(0, 3)] = 'daihon/pdf/' + f.name; });
  const dirs = ann.filter(f => f.type === 'dir' && !f.name.startsWith('_') && f.name !== 'pdf').map(f => f.name);
  links.annkenDirs = dirs;
  await Promise.all(dirs.map(async dir => {
    const t = await api.readText(`annken/${dir}/案件概要.md`);
    for (const m of String(t || '').matchAll(/videos\/(\d{3})-/g)) (links.annken[m[1]] ||= new Set()).add(dir);
  }));
  for (const k in links.annken) links.annken[k] = [...links.annken[k]];
  rv.links = links; return links;
}

/* ---------- Markdown をタップ単位に分ける ---------- */
function inlineMd(s, basePath) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, href) => {
      const raw = href.replace(/&amp;/g, '&');
      if (/^https?:/.test(raw)) return `<a href="${esc(raw)}" target="_blank" rel="noopener">${t}</a>`;
      const p = resolvePath(basePath, raw.split('#')[0]);
      return `<a href="#" data-open="${esc(p)}">${t}</a>`;
    })
    .replace(/(^|[^"=])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}
function resolvePath(base, rel) {
  const parts = base.split('/'); parts.pop();
  for (const seg of rel.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  return parts.join('/');
}
const plain = s => String(s || '').replace(/<[^>]+>/g, '').replace(/\*\*|`/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim();
function parseMarkdown(text, path) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  const blocks = []; let i = 0, ctx = '';

/* ---------- 台本 HTML をタップ単位に分ける ---------- */
const RV_LEAF = 'h1,h2,h3,h4,p,li,tr,pre,blockquote';
const RV_BLOCKY = 'p,div,table,ul,ol,h1,h2,h3,h4,pre,blockquote,li,tr,section';
async function loadTemplateCss() {
  if (rv.tplCss != null) return rv.tplCss;
  const t = await api.readText('.claude/skills/youtube-script/assets/template.html');
  rv.tplCss = (String(t || '').match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || []).map(s => s.replace(/<\/?style[^>]*>/gi, '')).join('\n');
  return rv.tplCss;
}
function prepareHtmlDoc(text) {
  const doc = new DOMParser().parseFromString(`<body>${text}</body>`, 'text/html');
  doc.querySelectorAll('script,style,link,iframe,object,embed').forEach(x => x.remove());
  doc.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => { if (/^on/i.test(a.name)) el.removeAttribute(a.name); }));
  const cand = [...doc.body.querySelectorAll(`${RV_LEAF},div`)].filter(el => el.tagName !== 'DIV' || !el.querySelector(RV_BLOCKY));
  const leaves = cand.filter(el => !cand.some(o => o !== el && el.contains(o)));
  const srcLines = String(text).split('\n').map(l => l.replace(/<[^>]+>/g, '').replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ''));
  const blocks = []; let ctx = '', from = 0;
  for (const el of doc.body.querySelectorAll('*')) {
    if (/^H[1-4]$/.test(el.tagName)) ctx = el.textContent.trim();
    if (!leaves.includes(el)) continue;
    const quote = el.textContent.replace(/\s+/g, ' ').trim(); if (!quote) continue;
    const key = quote.replace(/\s+/g, '').slice(0, 16);
    let line = 0;
    for (let k = from; k < srcLines.length; k++) if (key && srcLines[k].includes(key.slice(0, Math.min(8, key.length)))) { line = k + 1; from = k; break; }
    const b = { type: 'html', idx: blocks.length, quote: quote.slice(0, 300), line, label: ctx };
    el.setAttribute('data-b', b.idx); el.setAttribute('tabindex', '0'); el.classList.add('rv-blk');
    blocks.push(b);

  return { html: doc.body.innerHTML, blocks };
}

/* ---------- メモを書類の場所に結びつける ---------- */
function attachNotes(blocks, notes) {
  const map = {}, lost = [];
  const norm = s => String(s || '').replace(/\s+/g, '');
  const cand = blocks.filter(b => !b.skip);
  for (const n of notes) {
    const q = norm(n.anchor?.quote);
    let b = q && cand.find(x => norm(x.quote) === q);
    if (!b && q) b = cand.find(x => norm(x.quote).includes(q.slice(0, 24)) || q.includes(norm(x.quote).slice(0, 24)) && norm(x.quote).length > 8);
    if (!b && n.anchor?.line) {
      const near = cand.filter(x => x.line).sort((a, c) => Math.abs(a.line - n.anchor.line) - Math.abs(c.line - n.anchor.line))[0];
      if (near && Math.abs(near.line - n.anchor.line) <= 3) b = near;
    }
    if (b) (map[b.idx] ||= []).push(n); else lost.push(n);
  }
  return { map, lost };
}

/* ---------- 採否（企画書のフロントマターと ## コメント） ---------- */
function setFrontmatter(text, key, value) {
  const end = text.indexOf('\n---', 3); if (!text.startsWith('---') || end < 0) throw new Error('フロントマターが見つかりません');
  const head = text.slice(0, end), rest = text.slice(end);
  const re = new RegExp(`^${key}:[^\\n]*$`, 'm');
  if (!re.test(head)) return head + `\n${key}: ${value}` + rest;
  return head.replace(re, ln => {
    const ci = ln.search(/\s#/); const comment = ci >= 0 ? ln.slice(ci).trimStart() : '';
    let out = `${key}: ${value}`;
    if (comment) out += ' '.repeat(Math.max(2, ci + 1 - out.length)) + comment;
    return out;
  }) + rest;
}
function appendComment(text, line) {
  const lines = text.split('\n'); const i = lines.findIndex(l => /^##\s+コメント\s*$/.test(l));
  if (i < 0) return text.replace(/\s*$/, '') + `\n\n## コメント\n\n${line}\n`;
  let j = lines.findIndex((l, k) => k > i && /^##\s/.test(l)); if (j < 0) j = lines.length;
  let k = j - 1; while (k > i && !lines[k].trim()) k--;
  lines.splice(k + 1, 0, ...(k === i ? ['', line] : [line]));
  return lines.join('\n');
}
async function judgePlan(path, status) {
  const needReason = status !== '承認済';
  const pid = planIdOf(path);
  openModal(`<div class="head"><h2>${status === '承認済' ? '承認する' : status === '要修正' ? '要修正にする' : 'ボツにする'}</h2><span class="sp"></span><button class="btn sm" data-close>閉じる</button></div>
    <p class="note" style="font-size:13px">企画 ${esc(pid || '')} の status を「${status}」にし、判断した人（${esc(me().name)}）と日付（${todayStr()}）を記録します。${needReason ? '理由は企画書の「## コメント」に追記します（必須）。' : ''}</p>
    ${needReason ? `<div class="f"><label for="jdReason">理由</label><textarea id="jdReason" style="min-height:100px" placeholder="${status === 'ボツ' ? '例：025 と内容が重なるため' : '例：構成の章3が長すぎる。2つに分けたい'}"></textarea></div>` : `<div class="f"><label for="jdReason">ひとこと（任意・コメントに残ります）</label><input id="jdReason"></div>`}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" data-close>キャンセル</button><button class="btn ${status === 'ボツ' ? 'danger' : 'pri'}" id="jdOk">${status === '承認済' ? '承認する' : '確定する'}</button></div>`);
  $$('[data-close]', $('#sheet')).forEach(x => x.onclick = closeModal);
  $('#jdOk').onclick = e => guarded(e.currentTarget, async () => {
    const reason = $('#jdReason').value.trim();
    if (needReason && !reason) return toast('理由を入力してください', true);
    for (let tries = 0; tries < 3; tries++) {
      const f = await api.readFile(path);
      const prev = (/^status:\s*([^#\n]*)/m.exec(f.text) || [])[1]?.trim() || '';
      let t = setFrontmatter(f.text, 'status', status);
      t = setFrontmatter(t, 'reviewer', me().name);
      t = setFrontmatter(t, 'reviewed_on', todayStr());
      if (reason) t = appendComment(t, `- ${todayStr()} ${me().name}：${status === '承認済' ? '' : `【${status}】`}${reason.replace(/\n+/g, ' ')}`);
      try {
        await api.writeText(path, t, f.sha, `review: ${pid} 判断した（status: ${prev || '—'} → ${status}）（${me().name}）`);
        const p = state.plans?.find(x => x.id === pid); if (p) p.status = status;
        closeModal(); toast(`「${status}」にしました`); rv.doc.stale = true; await renderDoc(true); return;
      } catch (err) { if (err.status !== 409 && err.status !== 422) throw err; }
    }
    throw new Error('他の人の更新と競合しました。開き直してからもう一度お試しください');
  });
}

/* ---------- 元に戻す（直前の1回分） ---------- */
function undoInfo(path) {
  const d = rv.byPath[path]; if (!d) return null;
  const last = [...d.replies].filter(r => r.undo && r.before && (r.paths || [r.path]).includes(path)).sort((a, b) => b.at.localeCompare(a.at))[0];
  if (!last) return null;
  if (d.reverts.some(v => v.of === last.id)) return null;
  return last;
}
async function undoClaude(path, info, btn) {
  let warn = '';
  try { const latest = await api.lastCommitFor(path); if (latest && info.commit && !latest.startsWith(info.commit.slice(0, 7))) warn = 'Claude の修正のあとに、別の変更（採否など）が入っています。元に戻すと、その変更も消えます。'; } catch {}
  openModal(`<div class="head"><h2>Claude の修正を元に戻す</h2><span class="sp"></span><button class="btn sm" data-close>閉じる</button></div>
    <p style="font-size:13px">${fmtJPFull(new Date(info.at))}に Claude が反映する前の内容に戻します。対応したメモは「未対応」に戻ります。</p>
    ${warn ? `<p class="note" style="color:var(--bad)">${esc(warn)}</p>` : ''}
    <p class="note">戻せるのは直前の1回分だけです。Git の履歴には両方の版が残ります。</p>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" data-close>キャンセル</button><button class="btn danger" id="udOk">元に戻す</button></div>`);
  $$('[data-close]', $('#sheet')).forEach(x => x.onclick = closeModal);
  $('#udOk').onclick = e => guarded(e.currentTarget, async () => {
    const old = await api.readTextAt(path, info.before);
    if (old == null) throw new Error('修正前の版が見つかりませんでした');
    const cur = await api.readFile(path);
    const res = await api.writeText(path, old, cur.sha, `revert: ${planIdOf(path) || path} Claude の修正を取り消した（${me().name}）`);
    const d = rv.byPath[path];
    await api.addComment(d.issue.number, `${metaBlock('fy-revert', { of: info.id, by: me().id, commit: res?.commit?.sha || '' })}\n↩︎ **${me().name}** が ${fmtJPFull(new Date(info.at))} の Claude の修正を元に戻しました。${path.startsWith('daihon/html/') ? '\n台本PDFは次回の反映時に作り直します。' : ''}`);
    for (const id of info.notes || []) { const n = d.notes.find(x => x.id === id); if (n && n.status === 'done') await setNoteStatus(path, n, 'open'); }
    await refreshDocNotes(path);
    closeModal(); toast('元に戻しました'); rv.doc.stale = true; await renderDoc(true);
  });
}

const IDEA_NO = new Set(['_no response_', '_未入力_', 'none', '_none_', 'n/a', '-', '']);

    const v = m ? m[1].replace(/<!--[\s\S]*?-->/g, '').trim() : '';

  }
  return out;
}

  $$('[data-close]', $('#sheet')).forEach(x => x.onclick = closeModal);

  $$('.line button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#tab-home').classList.toggle('hide', t !== 'home');
  $('#tab-att').classList.toggle('hide', t !== 'att'); $('#tab-vid').classList.toggle('hide', t !== 'vid');
  $('#tab-rev').classList.toggle('hide', !['ideas', 'review'].includes(t));
  if (t === 'ideas') { rv.view = 'ideas'; renderRev(); }
  else if (t === 'review') { if (!opts.keep) { rv.view = 'list'; rv.doc = null; } renderRev(); }
  else if (t === 'home') renderHome();
  else if (t === 'att') renderAtt(); else renderVid();
  window.scrollTo({ top: 0 });
  $('.line button.on')?.scrollIntoView({ block: 'nearest', inline: 'center' });
  updateBadges();
}
$$('.line button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

async function boot() {
  const c = state.cfg;
  // 旧URL（kotatakata/fuyantech）の設定は、Organization に移した先へ書き換えて保存する
  const saved = LS.get('fy_cfg', null);
  if (saved && chanKey(saved) !== chanKey(c)) { LS.set('fy_cfg', c); LS.set('fy_channels', LS.get('fy_channels', []).map(x => chanKey(x) === chanKey(saved) ? c : x)); }
  api = (c.token && c.owner && c.repo) ? new GitHubBackend(c) : new DemoBackend();
  $('#demoBanner').classList.toggle('hide', !api.demo);
  document.body.classList.add('loading');
  renderChanSel();
  try {
    if (!api.demo && await discover(api)) {
      // 新方式：hensyu-* と seikyu-* を束ねる
      if (!ws.kikaku) api = NO_PLANS;
      hub = new OrdersHub(Object.entries(ws.hensyu).map(([id, be]) => ({ repo: HENSYU + id, be, editor: id })));
    } else {
      // 旧方式：企画リポジトリ1つに発注 Issue と seisaku/ がある
      const s = await api.readJSON(DATA + 'settings.json');
      if (s.data) state.settings = { ...DEFAULT_SETTINGS, ...s.data };
      hub = new OrdersHub([{ repo: api.demo ? 'demo' : c.repo, be: api, editor: null }]);
    }
    $('#projName').textContent = ws.channel?.name || state.settings.project;
    $('#meChip').textContent = `${me().name}（${ROLE_LABEL[me().role]}）`;
    const billable = editors().filter(e => ws.mode !== 'org' || ws.seikyu[e.id]);
    state.worker = me().role === 'editor' ? me().id : (billable[0]?.id || editors()[0]?.id || me().id);
    $$('.line button').forEach(b => b.classList.toggle('hide', !allowedTabs().includes(b.dataset.tab)));
    $('.line-steps').classList.toggle('only-vid', !allowedTabs().includes('ideas'));
    await Promise.all([loadIssues(), (ws.mode !== 'org' || ws.seikyu[state.worker]) ? loadWorklogs(state.worker) : null, loadTimers()]);
    await migrateLocalTimer();
  } catch (e) {
    console.error(e);
    toast(`読み込みに失敗しました：${e.message}`, true);
    $('#projName').textContent = state.settings.project; $('#meChip').textContent = me().name;
    state.worker ||= editors()[0]?.id;
  } finally { document.body.classList.remove('loading'); }
  const savedTab = LS.get('fy_tab', null);
  setTab(savedTab && savedTab !== 'att' && savedTab !== 'rev' ? savedTab : (me().role === 'editor' ? (savedTab === 'att' ? 'att' : 'vid') : 'home'));
  if (!LS.get('fy_cfg_seen', false) && api.demo) { LS.set('fy_cfg_seen', true); }
  if (canSeePlans()) Promise.all([loadPlans(), loadIdeas()]).then(updateBadges).catch(() => {});
}
boot();
</script>
</body>
</html>
